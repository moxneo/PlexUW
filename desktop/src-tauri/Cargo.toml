[package]
name = "plexuw"
version = "0.1.0"
description = "PlexUW desktop"
edition = "2021"

[lib]
name = "plexuw_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service", "crypto-rust"] }
secrecy = "0.10"
zeroize = "1"
uuid = { version = "1", features = ["v4"] }
url = "2"
open = "5"
regex = "1"
futures = "0.3"
tokio = { version = "1", features = ["time", "sync", "macros", "rt"] }
sha2 = "0.10"
hmac = "0.12"
raw-window-handle = "0.6"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tokio = { version = "1", features = ["time", "sync", "macros", "rt", "rt-multi-thread"] }

[features]
# Test/screenshot build only: fixture plex.tv + servers, in-memory secret store, no network.
mockplex = []

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
